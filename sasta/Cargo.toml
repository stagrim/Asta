[package]
name = "sasta"
version = "0.1.0"
edition = "2024"
authors = ["Esbjörn Stenberg <me@stagrim.com>"]
license = "GPL-3.0-or-later"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "multipart"] }

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-macros = "0.5.1"
hyper = { version = "1.11.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["full"] }
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
cron = "0.17.0"
chrono = { version = "0.4.45", features = ["serde"] }
tracing-subscriber = "0.3.23"
redis = { version = "1.7.0", features = [
    "tokio-comp",
    "json",
    "aio",
    "connection-manager",
] }
regex = "1.13.1"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
dotenvy = "0.15.7"
maud = { version = "0.27.0", features = ["axum"] }
crypto = { version = "0.5.1", features = ["digest"] }
sha2 = "0.11.0"
base16ct = { version = "1.0.0", features = ["alloc"] }
casta_protocol = { path = "../casta_protocol" }
lightningcss = "1.0.0-alpha.72"
minify-js = "0.6.0"
urlencoding = "2.1.3"
futures-channel = "0.3.34"
